<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unstoppable Rick</title>
<style>
  html,body { height:100%; margin:0; background:#000; }
  body {
    user-select: none;
    overscroll-behavior: none; /* stop pull-to-refresh on mobile */
    touch-action: none;
  }
  #rickVideo {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  /* Gate overlay */
  #gate {
    position: fixed; inset: 0; display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,.85);
  }
  #start {
    font: 600 18px/1.1 system-ui, -apple-system, Segoe UI, Roboto, Arial;
    padding: 14px 20px; border: 0; border-radius: 10px;
    box-shadow: 0 0 18px rgba(122, 93, 255, .7), inset 0 0 0 1px rgba(255,255,255,.2);
    background: linear-gradient(180deg, #7953ff, #5b35ff);
    color: #fff; cursor: pointer;
  }
  #start:focus { outline: 2px solid #bfa7ff; outline-offset: 3px; }
</style>
</head>
<body>

<video id="rickVideo" playsinline>
  <source src="https://cdn.mtdv.me/video/trolled.mp4" type="video/mp4" />
</video>

<div id="gate" aria-modal="true" role="dialog">
  <button id="start" aria-label="Start video with sound and fullscreen">▶ Click to Start with Sound</button>
</div>

<script>
  const video = document.getElementById('rickVideo');
  const gate  = document.getElementById('gate');
  const startBtn = document.getElementById('start');

  // --- Focus behavior so Tab highlights the button immediately ---
  function focusStartButton() {
    // Ensure the button is focusable then focus it
    if (gate.style.display !== 'none') {
      startBtn.tabIndex = 0;
      startBtn.focus({ preventScroll: true });
    }
  }

  // On load, put focus on the Start button
  window.addEventListener('DOMContentLoaded', focusStartButton);

  // If user presses Tab anywhere before starting, focus the Start button
  function preStartKeyHandler(e) {
    // Let Tab direct focus to the button
    if (e.key === 'Tab') {
      e.preventDefault();
      focusStartButton();
      return;
    }
    // Let Enter/Space activate the button when it's focused
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === startBtn) {
      e.preventDefault();
      startBtn.click();
      return;
    }
    // Block other keys aggressively pre-start
    if (e.key !== 'Tab') {
      e.preventDefault();
      e.stopPropagation();
    }
  }
  ['keydown','keypress','keyup'].forEach(type =>
    window.addEventListener(type, preStartKeyHandler, { capture: true })
  );

  // Keep focus trapped on the button while gate is visible
  document.addEventListener('focusin', (e) => {
    if (gate.style.display !== 'none' && e.target !== startBtn) {
      e.stopPropagation();
      focusStartButton();
    }
  });

  // --- Start logic (user gesture required for sound/fullscreen) ---
  async function startPlayback() {
    try {
      video.muted = false;
      await video.play();
    } catch {
      // If blocked, fallback to muted then allow user to unmute with media key/click later
      video.muted = true;
      await video.play().catch(()=>{});
    }

    // Try fullscreen after user action
    try {
      const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch {}

    // Hide gate and resume “unstoppable” behavior
    gate.style.display = 'none';

    // Prevent pausing
    video.addEventListener('pause', () => video.play());

    // Replace pre-start key handler with strong blocker (after gesture)
    ['keydown','keypress','keyup'].forEach(type =>
      window.removeEventListener(type, preStartKeyHandler, { capture: true })
    );

    const strongBlocker = (e) => {
      // Let nothing through (browsers may still allow reserved combos)
      e.preventDefault();
      e.stopPropagation();
      return false;
    };
    ['keydown','keypress','keyup'].forEach(type =>
      window.addEventListener(type, strongBlocker, { capture: true })
    );

    // Keep playing if refocused
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && video.paused) {
        video.play().catch(()=>{});
      }
    });
    window.addEventListener('blur', () => {
      if (video.paused) video.play().catch(()=>{});
    });
  }

  startBtn.addEventListener('click', startPlayback, { once: true });

  // --- Misc hardening ---
  video.controls = false;
  window.addEventListener('contextmenu', e => e.preventDefault());
  ['dragstart','selectstart'].forEach(ev =>
    window.addEventListener(ev, e => e.preventDefault())
  );

  // “Are you sure?” on tab close (string may be ignored; confirms still show)
  window.addEventListener('beforeunload', (e) => {
    e.preventDefault();
    e.returnValue = 'areyou sure?';
  });
</script>
</body>
</html>
